name: CE Empire CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/digital-twin-v4-no-vercel-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript, Vitest and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
